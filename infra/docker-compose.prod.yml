services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: digimitra_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=WARNING
      - LOG_FORMAT=json

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: digimitra_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
