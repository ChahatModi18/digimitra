[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digimitra-backend"
version = "0.1.0"
description = "DigiMitra - AI-Assisted Digital Consultant Framework for Indian MSMEs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DigiMitra Research & Development Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "greenlet>=3.0.0",
    "aiomysql>=0.2.0",
    "asyncmy>=0.2.9",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
pythonpath = [
    ".",
]
